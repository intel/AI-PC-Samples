# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Automatically finds ALL nested UV projects anywhere in the repo
  - package-ecosystem: "uv"
    directories:
      - "/**"            # Recursively scans all folders for pyproject.toml / uv.lock
    schedule:
      interval: "weekly"

  # 2. Automatically finds ALL standalone requirements.txt files anywhere in the repo
  - package-ecosystem: "pip"
    directories:
      - "/**"            # Recursively scans all folders for requirements.txt
    schedule:
      interval: "weekly"

