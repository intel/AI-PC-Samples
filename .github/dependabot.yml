# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Track each UV project explicitly so Dependabot only scans valid manifest directories
  - package-ecosystem: "uv"
    directories:
      - "/AI-Upscaling-With-NPU"
      - "/Finetune_Image_Captioning"
      - "/Genre-driven-storytelling"
      - "/LLM/PyTorch"
      - "/Video-Description-Generation-Query-Retrieval"
      - "/openvino_notebooks/gpu-device"
      - "/openvino_notebooks/hello-npu"
    schedule:
      interval: "weekly"

  # 2. Automatically finds ALL standalone requirements.txt files anywhere in the repo
  - package-ecosystem: "pip"
    directories:
      - "/**"            # Recursively scans all folders for requirements.txt
    schedule:
      interval: "weekly"
