[project]
name = "openvino-tokenizers-notebook"
version = "0.1.0"
description = "Isolated environment for openvino-tokenizers notebook."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "openvino==2026.2.1",
    "openvino-tokenizers[transformers]==2026.2.1.0",
    "openvino-genai==2026.2.1.0",
    "torch==2.13.0",
    "transformers>=5.10.0",
    "huggingface_hub>=1.5.0",
    "tqdm>=4.66",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "jupyterlab>=4.6.3",
    "jupyter_server>=2.20.0",
    "mistune>=3.3.4",
    "notebook>=7.2",
    "jupyter_client>=8.6",
    "ipykernel>=6.29",
    "ipywidgets>=8.1.8",
    "setuptools>=84.0.0",
    "tornado>=6.5.8"
]

[tool.uv]
required-version = ">=0.5.0"
link-mode = "copy"
