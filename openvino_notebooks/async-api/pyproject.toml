[project]
name = "async-api"
version = "0.1.0"
description = "Isolated environment for async-api notebook."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "openvino>=2026.3.1",
    "opencv-python>=4.9.0",
    "pillow>=12.3.0",
    "tqdm>=4.66",
    "matplotlib>=3.4",
    "huggingface_hub>=0.23",

    "jupyterlab>=4.6.3",
    "jupyter_server>=2.20.0",
    "mistune>=3.3.4",
    "notebook>=7.2",
    "jupyter_client>=8.6",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",

    "tornado>=6.5.8",
    "pyzmq>=25.1",
    "websocket-client>=1.7",

    "requests>=2.31",
    "IPython>=8.20",
    "numpy>=1.26",
    "setuptools>=84.0.0"
]

[tool.uv]
required-version = ">=0.5.0"
link-mode = "copy"
