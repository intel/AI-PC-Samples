[project]
name = "hello-npu"
version = "0.1.0"
description = "Hello NPU example notebook"
readme = "README.md"
requires-python = ">=3.12"

# All runtime dependencies needed to run THIS notebook
dependencies = [
    "openvino>=2026.2",
    "huggingface_hub",
    "requests",
    "jupyterlab>=4.6.2",
    "jupyter-server>=2.20.0",
    "ipykernel",
    "mistune>=3.3.0",
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
    "tornado>=6.5.8"
]

[tool.uv]
required-version = ">=0.5.0"
link-mode = "copy"
